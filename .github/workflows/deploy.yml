name: Rafraîchir les épisodes et déployer

on:
  # Chaque nuit vers 3 h (heure de Paris en hiver)
  schedule:
    - cron: '17 2 * * *'
  # À chaque modification poussée sur main (podcasts.json compris)
  push:
    branches: [main]
  # Bouton « Run workflow » dans l'onglet Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Le script garde les épisodes de la veille si un flux est en panne :
      # on récupère donc la version actuellement en ligne.
      - name: Récupérer episodes.json en ligne
        run: |
          mkdir -p public
          curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/episodes.json" -o public/episodes.json \
            || echo "Pas de version en ligne (premier déploiement)."

      - name: Lire les flux et générer episodes.json
        run: npm run episodes

      - name: Construire l'app
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
